/* Layout : scène 3D plein écran, interface flottante en surimpression (look jeu, sombre uniquement) */
:root{
  --ink:#FFF6E5; --muted:#E8D6BC; --panel:rgba(28,20,14,.78); --line:rgba(255,246,229,.18);
  --accent:#F2C14E; --red:#E0563A; --bg:#0B1A33;
  --display:'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body:Nunito, system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:2;pointer-events:none}
.hud > *{pointer-events:auto}
.title{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));max-width:min(420px, calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px;backdrop-filter:blur(8px)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1;color:var(--accent);text-shadow:0 3px 0 #7A3A12}
.info{margin:8px 0 0;font-size:14px;line-height:1.45;color:var(--ink)}
.views{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.views button{font-family:var(--display);font-size:16px;letter-spacing:.02em;color:#2B1D14;background:var(--accent);border:0;border-radius:999px;
  min-height:44px;padding:0 18px;box-shadow:0 4px 0 #9C6B12;cursor:pointer;transition:transform .12s}
.views button:hover{transform:translateY(-2px)}
.views button[aria-pressed="true"]{background:var(--red);color:#FFF6E5;box-shadow:0 4px 0 #8A2A17}
.views button.ghost{background:var(--panel);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.views button:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.hint{top:calc(16px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));font-size:12px;font-weight:700;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:16px}
@media (max-width:640px){.hint{display:none}.info{font-size:13px}.views button{font-size:14px;padding:0 14px}}
@media (prefers-reduced-motion: reduce){.views button{transition:none}}
</style>

<script>
(function(){
if(!window.THREE){document.getElementById('err').hidden=false;return;}
const V3=THREE.Vector3;
// ---------- aléatoire déterministe ----------
let seed=1337; function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const R=(a,b)=>a+rng()*(b-a); const pick=a=>a[Math.floor(rng()*a.length)];

// ---------- rendu ----------
const canvas=document.getElementById('scene');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById('err').hidden=false;return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xdcecff,500,2600);
const camera=new THREE.PerspectiveCamera(58,1,0.2,6000);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxDistance=1600; controls.minDistance=2; controls.autoRotateSpeed=0.6;

// ---------- ciel ----------
const sky=new THREE.Mesh(new THREE.SphereGeometry(4000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying vec3 vP;void main(){float h=vP.y;vec3 top=vec3(0.02,0.07,0.22);vec3 mid=vec3(0.22,0.50,0.90);vec3 hor=vec3(0.86,0.93,1.0);vec3 bot=vec3(0.97,0.95,0.92);vec3 c=h>0.0?mix(hor,mid,smoothstep(0.0,0.22,h)):mix(hor,bot,smoothstep(0.0,-0.25,h));c=mix(c,top,smoothstep(0.25,0.95,h));gl_FragColor=vec4(c,1.0);}'}));
scene.add(sky);
// étoiles en haut du ciel
{const g=new THREE.BufferGeometry();const p=[];for(let i=0;i<900;i++){const th=R(0,Math.PI*2),ph=R(0.05,1.2);p.push(Math.cos(th)*Math.sin(ph)*3500,Math.cos(ph)*3500,Math.sin(th)*Math.sin(ph)*3500);}
 g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const st=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:3,sizeAttenuation:false,fog:false,transparent:true,opacity:.75}));sky.add(st);}

// ---------- lumières ----------
scene.add(new THREE.HemisphereLight(0xcfe6ff,0xe0c08a,0.75));
const sun=new THREE.DirectionalLight(0xfff0d6,1.7);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera; sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=1;sc.far=400; sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);
const sunOffset=new V3(120,180,90);
// soleil visible
{const s=new THREE.Mesh(new THREE.SphereGeometry(60,24,16),new THREE.MeshBasicMaterial({color:0xfff4c8,fog:false}));s.position.set(1600,1500,1300);scene.add(s);}

// ---------- textures procédurales ----------
function tex(size,draw,rx,ry){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');draw(g,size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function planks(base,line,vertical,n){return(g,s)=>{g.fillStyle=base;g.fillRect(0,0,s,s);const w=s/n;for(let i=0;i<n;i++){const p=i*w;g.fillStyle='rgba(0,0,0,'+(rng()*0.18)+')';vertical?g.fillRect(p,0,w,s):g.fillRect(0,p,s,w);
 for(let k=0;k<50;k++){g.fillStyle=rng()<.5?'rgba(0,0,0,'+(rng()*0.1)+')':'rgba(255,255,255,'+(rng()*0.07)+')';const a=rng()*s,b=p+rng()*w;vertical?g.fillRect(b,a,1.5,20+rng()*80):g.fillRect(a,b,20+rng()*80,1.5);}
 g.fillStyle=line;vertical?g.fillRect(p,0,4,s):g.fillRect(0,p,s,4);
 g.fillStyle='rgba(0,0,0,.35)';for(let k=0;k<2;k++){const a=rng()*s;vertical?(g.fillRect(p+6,a,3,3),g.fillRect(p+w-9,a,3,3)):(g.fillRect(a,p+6,3,3),g.fillRect(a,p+w-9,3,3));}}};}
const T={
 barn:tex(512,planks('#B8402A','#7E2616',true,8),3,1.5),
 wood:tex(512,planks('#A8743F','#5C3A22',false,6),2,2),
 dark:tex(512,planks('#6E4A2E','#3A2414',false,6),2,2),
 crate:tex(256,(g,s)=>{planks('#D3A066','#8A5A35',false,4)(g,s);g.strokeStyle='#8A5A35';g.lineWidth=22;g.strokeRect(0,0,s,s);g.lineWidth=16;g.beginPath();g.moveTo(0,0);g.lineTo(s,s);g.stroke();},1,1),
 straw:tex(256,(g,s)=>{g.fillStyle='#E7B84A';g.fillRect(0,0,s,s);for(let i=0;i<900;i++){g.strokeStyle=pick(['#F7D774','#C9952E','#FBE29A','#B9852A']);g.lineWidth=1+rng()*1.5;const x=rng()*s,y=rng()*s,a=R(-0.5,0.5)+(rng()<.5?0:Math.PI/2);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*R(8,22),y+Math.sin(a)*R(8,22));g.stroke();}},1,1),
 metal:tex(256,(g,s)=>{for(let x=0;x<s;x+=16){const gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'#7C8A94');gr.addColorStop(.5,'#C3CCD2');gr.addColorStop(1,'#6E7B85');g.fillStyle=gr;g.fillRect(x,0,16,s);}for(let i=0;i<60;i++){g.fillStyle='rgba(120,70,30,'+(rng()*0.25)+')';g.beginPath();g.arc(rng()*s,rng()*s,R(2,10),0,7);g.fill();}},4,2),
 grass:tex(512,(g,s)=>{g.fillStyle='#5E9B3E';g.fillRect(0,0,s,s);for(let i=0;i<5000;i++){g.fillStyle=pick(['#6FAE4A','#4E8A33','#86C05A','#5A9439']);g.fillRect(rng()*s,rng()*s,2+rng()*3,2+rng()*5);}},8,8),
 wire:tex(128,(g,s)=>{g.clearRect(0,0,s,s);g.strokeStyle='#D9DEE2';g.lineWidth=4;for(let i=-s;i<s*2;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i+s,s);g.stroke();g.beginPath();g.moveTo(i+s,0);g.lineTo(i,s);g.stroke();}},3,3),
 carton:tex(128,(g,s)=>{g.fillStyle='#CDB48A';g.fillRect(0,0,s,s);for(let i=0;i<400;i++){g.fillStyle='rgba(90,60,30,'+(rng()*0.15)+')';g.fillRect(rng()*s,rng()*s,2,2);}},1,1)
};
// ---------- matériaux ----------
const MC={};function m(c,o){const k=c+JSON.stringify(o||{});return MC[k]||(MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o||{})));}
const MAT={
 barn:new THREE.MeshStandardMaterial({map:T.barn,roughness:.9}),
 wood:new THREE.MeshStandardMaterial({map:T.wood,roughness:.9}),
 dark:new THREE.MeshStandardMaterial({map:T.dark,roughness:.95}),
 crate:new THREE.MeshStandardMaterial({map:T.crate,roughness:.9}),
 straw:new THREE.MeshStandardMaterial({map:T.straw,roughness:1}),
 metal:new THREE.MeshStandardMaterial({map:T.metal,roughness:.45,metalness:.6}),
 grass:new THREE.MeshStandardMaterial({map:T.grass,roughness:1}),
 wire:new THREE.MeshStandardMaterial({map:T.wire,transparent:true,alphaTest:.4,side:THREE.DoubleSide,metalness:.5,roughness:.5}),
 carton:new THREE.MeshStandardMaterial({map:T.carton,roughness:1}),
 trim:m('#F3E9D6'), roof:m('#4A3020'), win:m('#1E1510',{roughness:.3}), twine:m('#7A4A2A'),
 egg:m('#FFF6E5',{roughness:.5}), rope:m('#C9A66B'), tire:m('#232323',{roughness:.7}), sack:m('#E9DCC0',{roughness:1}),
 lamp:new THREE.MeshStandardMaterial({color:0xff6a2a,emissive:0xff4a10,emissiveIntensity:2.2}),
 gold:new THREE.MeshStandardMaterial({color:0xF2C14E,emissive:0xffb020,emissiveIntensity:1.6})
};

// ---------- helpers ----------
function add(parent,geo,mat,x,y,z){const me=new THREE.Mesh(geo,mat);me.position.set(x||0,y||0,z||0);me.castShadow=true;me.receiveShadow=true;parent.add(me);return me;}
function box(p,w,h,d,mat,x,y,z){return add(p,new THREE.BoxGeometry(w,h,d),mat,x,y,z);}
function grp(p,x,y,z,ry){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry||0;p.add(g);return g;}
const UP=new V3(0,1,0);
function beam(p,a,b,t,mat,round){const len=a.distanceTo(b);const geo=round?new THREE.CylinderGeometry(t,t,len,8):new THREE.BoxGeometry(t,len,t);const me=add(p,geo,mat);me.position.copy(a).add(b).multiplyScalar(.5);me.quaternion.setFromUnitVectors(UP,b.clone().sub(a).normalize());return me;}

// ---------- POULES (drôles : yeux globuleux, pattes trop fines) ----------
const chickens=[];
function makeChicken(o){
 o=o||{};
 const g=new THREE.Group(); const inner=new THREE.Group(); g.add(inner);
 const gold=o.gold;
 const bodyM=gold?new THREE.MeshStandardMaterial({color:0xE2B13C,metalness:.9,roughness:.22}):m(o.body||'#FFF3DC',{roughness:.95});
 const wingM=gold?bodyM:m(o.wing||'#E6D5B5',{roughness:.95});
 const bellyM=gold?bodyM:m(o.belly||o.body||'#FFFFFF',{roughness:1});
 const redM=gold?bodyM:m('#D83A2A',{roughness:.6}); const orM=gold?bodyM:m('#F39A1E',{roughness:.55});
 const torso=add(inner,new THREE.SphereGeometry(.6,28,20),bodyM,0,.95,0); torso.scale.set(1,.92,1.15);
 add(inner,new THREE.SphereGeometry(.42,20,14),bellyM,0,.9,.4);
 for(let i=0;i<3;i++){const f=add(inner,new THREE.SphereGeometry(.22,14,10),wingM,(i-1)*.17,1.28+(i===1?.12:0),-.62);f.scale.set(.6,1.7,.5);f.rotation.x=-.55;f.rotation.z=(i-1)*.45;}
 add(inner,new THREE.SphereGeometry(.3,16,12),bodyM,0,1.3,.24);
 const head=new THREE.Group(); head.position.set(0,1.55,.36); inner.add(head);
 add(head,new THREE.SphereGeometry(.37,26,18),bodyM);
 [[0,.38,.06,.12],[0,.43,-.1,.13],[0,.37,.2,.1],[0,.33,-.24,.09]].forEach(c=>add(head,new THREE.SphereGeometry(c[3],12,10),redM,c[0],c[1],c[2]));
 const beak=add(head,new THREE.ConeGeometry(.1,.28,14),orM,0,-.03,.44); beak.rotation.x=Math.PI/2;
 const wat=add(head,new THREE.SphereGeometry(.075,10,8),redM,0,-.19,.36); wat.scale.y=1.7;
 const eyes=[]; const es=o.eyes||[.15,.15];
 [-1,1].forEach((s,i)=>{const r=es[i];const e=add(head,new THREE.SphereGeometry(r,18,14),m('#FFFFFF',{roughness:.25}),s*.2,.1,.27);const pu=add(e,new THREE.SphereGeometry(r*.42,12,10),m('#111111',{roughness:.2}),0,0,r*.72);eyes.push({pu,r,ph:R(0,9)});});
 const wings=[]; [-1,1].forEach(s=>{const piv=new THREE.Group();piv.position.set(s*.52,1.1,0);inner.add(piv);const w=add(piv,new THREE.SphereGeometry(.3,16,12),wingM,s*.1,-.16,-.02);w.scale.set(.32,.95,1.15);wings.push({piv,s});});
 const legs=[]; [-1,1].forEach(s=>{const piv=new THREE.Group();piv.position.set(s*.2,.48,.05);inner.add(piv);add(piv,new THREE.CylinderGeometry(.04,.04,.5,8),orM,0,-.24,0);for(let k=-1;k<=1;k++){const toe=add(piv,new THREE.BoxGeometry(.05,.04,.3),orM,k*.08,-.49,.11);toe.rotation.y=k*.5;}legs.push(piv);});
 let prop=null;
 (o.acc||[]).forEach(a=>{
  if(a==='bandana'){const b=add(inner,new THREE.TorusGeometry(.31,.07,8,24),m('#C8432B'),0,1.3,.2);b.rotation.x=Math.PI/2*.75;const k=add(inner,new THREE.ConeGeometry(.12,.35,4),m('#C8432B'),0,1.25,-.1);k.rotation.x=-2.2;}
  if(a==='goggles'){[-1,1].forEach(s=>{const r=add(head,new THREE.TorusGeometry(.1,.035,8,16),m('#5C3A22'),s*.13,.24,.27);r.rotation.x=-.5;const gl=add(head,new THREE.SphereGeometry(.09,12,8),m('#4FA3A5',{roughness:.1,metalness:.3}),s*.13,.24,.28);gl.scale.z=.35;gl.rotation.x=-.5;});const st=add(head,new THREE.TorusGeometry(.37,.03,6,30),m('#5C3A22'),0,.2,0);st.rotation.x=Math.PI/2-.35;}
  if(a==='scarf'){const sc=add(inner,new THREE.TorusGeometry(.3,.08,8,20),m('#F2F2F2'),0,1.3,.2);sc.rotation.x=Math.PI/2*.8;const tail=add(inner,new THREE.BoxGeometry(.18,.06,.9),m('#F2F2F2'),.12,1.32,-.55);tail.rotation.x=.35;tail.rotation.y=.3;}
  if(a==='backpack'){box(inner,.55,.6,.32,m('#4FA3A5'),0,1.05,-.62);box(inner,.5,.12,.08,m('#2F7F81'),0,1.2,-.8);}
  if(a==='propeller'){add(head,new THREE.SphereGeometry(.2,14,8,0,Math.PI*2,0,Math.PI/2),m('#E0563A'),0,.34,0);add(head,new THREE.CylinderGeometry(.02,.02,.16,6),m('#333333'),0,.6,0);prop=new THREE.Group();prop.position.set(0,.68,0);head.add(prop);box(prop,.7,.02,.09,m('#F2C14E'),0,0,0);box(prop,.09,.02,.7,m('#4FA3A5'),0,0,0);}
  if(a==='hardhat'){add(head,new THREE.SphereGeometry(.39,20,10,0,Math.PI*2,0,Math.PI/2),m('#F2C14E',{roughness:.4}),0,.14,0);add(head,new THREE.CylinderGeometry(.5,.5,.04,24),m('#F2C14E',{roughness:.4}),0,.15,.05);}
  if(a==='mustache'){[-1,1].forEach(s=>{const mu=add(head,new THREE.SphereGeometry(.1,10,8),m('#3A2414'),s*.11,-.13,.38);mu.scale.set(1.7,.55,.6);mu.rotation.z=s*.35;});}
  if(a==='crown'){add(head,new THREE.CylinderGeometry(.18,.2,.15,6,1,true),m('#F2C14E',{metalness:.8,roughness:.3,side:THREE.DoubleSide}),0,.55,0);}
 });
 g.userData={inner,head,eyes,wings,legs,prop,anim:o.anim||'idle',ph:R(0,20)};
 chickens.push(g); return g;
}
function randomHen(anim){const c=pick([['#FFF3DC','#E6D5B5'],['#D9692E','#A84A1C'],['#8B5A3C','#5E3A24'],['#2F2B38','#1F1C26'],['#F0E0C0','#C9A06A']]);const acc=[pick(['propeller','bandana','goggles','hardhat','mustache','backpack','crown',''])];
 return makeChicken({body:c[0],wing:c[1],eyes:[R(.12,.18),R(.12,.18)],acc,anim});}

// ---------- mer de nuages ----------
{const geo=new THREE.IcosahedronGeometry(1,2);const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,emissive:0x8899aa,emissiveIntensity:.18});
 const N=650;const im=new THREE.InstancedMesh(geo,mat,N);const d=new THREE.Object3D();
 for(let i=0;i<N;i++){const a=R(0,Math.PI*2),r=Math.sqrt(rng())*1700+30;d.position.set(Math.cos(a)*r,R(-46,-26),Math.sin(a)*r);const s=R(25,70);d.scale.set(s,R(9,22),s*R(.7,1.2));d.rotation.y=R(0,3);d.updateMatrix();im.setMatrixAt(i,d.matrix);}
 im.receiveShadow=true;scene.add(im);
 // nuages en altitude autour de la tour
 const N2=140;const im2=new THREE.InstancedMesh(geo,mat,N2);
 for(let i=0;i<N2;i+=7){const a=R(0,Math.PI*2),r=R(90,320),y=R(60,460);for(let k=0;k<7;k++){d.position.set(Math.cos(a)*r+R(-18,18),y+R(-3,5),Math.sin(a)*r+R(-18,18));const s=R(7,16);d.scale.set(s,s*.55,s);d.updateMatrix();im2.setMatrixAt(i+k,d.matrix);}}
 scene.add(im2);}

// ---------- île de départ (la ferme) ----------
const island=grp(scene,0,0,0);

function animHen(c,t){const u=c.userData;const ph=u.ph;
 u.eyes.forEach(e=>{e.pu.position.x=Math.sin(t*(u.anim==='panic'?14:2.6)+e.ph)*e.r*.32;e.pu.position.y=Math.cos(t*(u.anim==='panic'?11:2.1)+e.ph)*e.r*.28;});
 if(u.prop)u.prop.rotation.y=t*18;
 const W=u.wings,L=u.legs;
 if(u.anim==='idle'||u.anim==='reach'||u.anim==='squish'){
  u.head.rotation.x=Math.pow(Math.max(0,Math.sin(t*1.1+ph)),14)*.9;
  u.head.rotation.y=Math.sin(t*.7+ph)*.4;
  u.inner.position.y=Math.abs(Math.sin(t*2+ph))*.04;
  const burst=Math.pow(Math.max(0,Math.sin(t*.8+ph*2)),24);
  W.forEach(w=>w.piv.rotation.z=w.s*(.08+burst*1.3*Math.abs(Math.sin(t*28))));
  if(u.anim==='reach')W.forEach(w=>w.piv.rotation.z=w.s*(2.2+Math.sin(t*9)*.3));
  if(u.anim==='squish'){u.inner.scale.set(1.12,.82+Math.sin(t*7)*.03,1.12);u.head.rotation.x=-.3;}
 }else if(u.anim==='panic'){
  W.forEach(w=>w.piv.rotation.z=w.s*(.6+Math.sin(t*38)*.9));L.forEach((l,i)=>l.rotation.x=Math.sin(t*22+i*3)*.9);u.head.rotation.x=-.4+Math.sin(t*9)*.2;
 }else if(u.anim==='glide'){
  W.forEach(w=>w.piv.rotation.z=w.s*(1.45+Math.sin(t*5)*.08));L.forEach(l=>l.rotation.x=.9);u.inner.rotation.z=Math.sin(t*1.3)*.12;
 }else if(u.anim==='dangle'){
  L.forEach((l,i)=>l.rotation.x=Math.sin(t*3+i*3)*.5);W.forEach(w=>w.piv.rotation.z=w.s*(.5+Math.sin(t*3)*.2));u.head.rotation.y=Math.sin(t*.6)*.6;
 }else if(u.anim==='wave'){
  W[0].piv.rotation.z=-.1;W[1].piv.rotation.z=2.3+Math.sin(t*8)*.4;u.head.rotation.y=Math.sin(t*.9)*.5;
 }else if(u.anim==='vane'){
  u.head.rotation.x=0;
 }}
